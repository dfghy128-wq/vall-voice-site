
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vall Voice</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111315;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 35px 28px;
      background: #1b1e21;
      border: 1px solid #303438;
      border-radius: 18px;
      text-align: center;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #e5e5e5;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #92999f;
      font-size: 14px;
      margin-bottom: 30px;
    }

    h2 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    p {
      color: #a4a9ad;
      font-size: 14px;
      line-height: 1.8;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-top: 18px;
      background: #111315;
      border: 1px solid #41474c;
      border-radius: 10px;
      color: white;
      text-align: center;
      font-size: 22px;
      letter-spacing: 5px;
      outline: none;
      text-transform: uppercase;
    }

    input:focus {
      border-color: #aeb5bb;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #e5e5e5;
      color: #151719;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      min-height: 22px;
    }

    .footer {
      margin-top: 28px;
      color: #666d72;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">VALL</div>
    <div class="subtitle">Vall Voice Verification</div>

    <h2>ربط حساب Roblox</h2>
    <p>
      أدخل رمز التحقق الذي حصلت عليه داخل لعبة Vall.
    </p>

    <input
      id="code"
      type="text"
      maxlength="6"
      placeholder="XXXXXX"
      autocomplete="off"
    >

    <button id="verify">تحقق من الرمز</button>

    <div id="message"></div>

    <div class="footer">
      VALL MIC · OFFICIAL WEBSITE
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://zculvexbqmswhpvixvui.supabase.co";

    // ضع هنا مفتاح Supabase Publishable فقط
    const SUPABASE_KEY = "sb_publishable_Xa-OZKwLJ1xaqUUtuIgpgA_MSJuON_v";

    const codeInput = document.getElementById("code");
    const button = document.getElementById("verify");
    const message = document.getElementById("message");

    codeInput.addEventListener("input", () => {
      codeInput.value = codeInput.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");
    });

    button.addEventListener("click", async () => {
      const code = codeInput.value.trim();

      if (code.length !== 6) {
        message.style.color = "#ff7777";
        message.textContent = "يرجى إدخال رمز مكون من 6 خانات.";
        return;
      }

      button.disabled = true;
      button.textContent = "جارٍ التحقق...";
      message.textContent = "";

      try {
        const response = await fetch(
          SUPABASE_URL + "/functions/v1/claim-code",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY
            },
            body: JSON.stringify({ code })
          }
        );

        const result = await response.json();

        if (response.ok && result.success) {
          message.style.color = "#75d69a";
          message.textContent = "تم التحقق من الرمز بنجاح!";
        } else {
          message.style.color = "#ff7777";
          message.textContent =
            result.error === "Code not found"
              ? "الرمز غير صحيح."
              : result.error === "Code already linked"
              ? "تم استخدام هذا الرمز مسبقاً."
              : "تعذر التحقق من الرمز.";
        }
      } catch (error) {
        message.style.color = "#ff7777";
        message.textContent = "حدث خطأ في الاتصال، حاول مرة أخرى.";
      }

      button.disabled = false;
      button.textContent = "تحقق من الرمز";
    });
  </script>
</body>
</html>
